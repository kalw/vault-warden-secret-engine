version: 2

project_name: vault-warden-secret-engine

builds:
  - id: plugin
    main: ./cmd/vault-warden-secret-engine
    binary: vault-warden-secret-engine
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}
    goos:
      - linux
      - darwin
      - freebsd
      - openbsd
    goarch:
      - amd64
      - arm64

archives:
  - id: binaries
    formats:
      - binary
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^style:"
      - "^refactor:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: kalw
    name: vault-warden-secret-engine
  prerelease: auto
  draft: false
  header: |
    Pre-built `vault-warden-secret-engine` plugin binaries.

    Download the asset matching your Vault server's OS/arch, verify it against
    `checksums.txt`, then register the SHA-256 with Vault's plugin catalog.
