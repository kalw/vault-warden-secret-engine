name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Unit tests
        run: go test ./... -v

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, freebsd, openbsd]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Cross-compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -o /dev/null ./cmd/vault-warden-secret-engine

  acceptance:
    name: Acceptance tests (live Warden)
    runs-on: ubuntu-latest
    needs: test
    # Never expose secrets to pull requests from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Acceptance tests
        env:
          WARDEN_URL: ${{ secrets.WARDEN_URL }}
          WARDEN_CLIENT_ID: ${{ secrets.WARDEN_CLIENT_ID }}
          WARDEN_CLIENT_SECRET: ${{ secrets.WARDEN_CLIENT_SECRET }}
          WARDEN_EMAIL: ${{ secrets.WARDEN_EMAIL }}
          WARDEN_MASTER_PASSWORD: ${{ secrets.WARDEN_MASTER_PASSWORD }}
        run: |
          if [ -z "$WARDEN_URL" ] || [ -z "$WARDEN_CLIENT_ID" ]; then
            echo "Warden secrets not configured; skipping live acceptance tests."
            echo "Add WARDEN_URL, WARDEN_CLIENT_ID, WARDEN_CLIENT_SECRET,"
            echo "WARDEN_EMAIL, and WARDEN_MASTER_PASSWORD repository secrets to enable."
            exit 0
          fi
          VAULT_ACC=1 go test -run TestAcceptance -v -count=1
