name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Unit tests
        run: go test ./... -v

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, freebsd, openbsd]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Cross-compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -o /dev/null ./cmd/vault-vaultwarden-secret-engine

  acceptance:
    name: Acceptance tests (live Vaultwarden)
    runs-on: ubuntu-latest
    needs: test
    # Never expose secrets to pull requests from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Acceptance tests
        env:
          VAULTWARDEN_URL: ${{ secrets.VAULTWARDEN_URL }}
          VAULTWARDEN_CLIENT_ID: ${{ secrets.VAULTWARDEN_CLIENT_ID }}
          VAULTWARDEN_CLIENT_SECRET: ${{ secrets.VAULTWARDEN_CLIENT_SECRET }}
          VAULTWARDEN_EMAIL: ${{ secrets.VAULTWARDEN_EMAIL }}
          VAULTWARDEN_MASTER_PASSWORD: ${{ secrets.VAULTWARDEN_MASTER_PASSWORD }}
        run: |
          if [ -z "$VAULTWARDEN_URL" ] || [ -z "$VAULTWARDEN_CLIENT_ID" ]; then
            echo "Vaultwarden secrets not configured; skipping live acceptance tests."
            echo "Add VAULTWARDEN_URL, VAULTWARDEN_CLIENT_ID, VAULTWARDEN_CLIENT_SECRET,"
            echo "VAULTWARDEN_EMAIL, and VAULTWARDEN_MASTER_PASSWORD repository secrets to enable."
            exit 0
          fi
          VAULT_ACC=1 go test -run TestAcceptance -v -count=1
